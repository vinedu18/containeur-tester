# Containeur Tester - Default Configuration
# This file is sourced by the plugin on install

# Health check timeout in seconds (how long to wait before declaring a test container healthy)
TEST_TIMEOUT=120

# Check interval in seconds between status polls
CHECK_INTERVAL=10

# Maximum parallel test containers
MAX_PARALLEL_TESTS=3

# Default schedule (cron expression) - default: daily at 2 AM
# Format: minute hour day month weekday
TEST_SCHEDULE="0 2 * * *"

# Log retention in days
LOG_RETENTION_DAYS=30

# Docker host (leave empty for local socket)
DOCKER_HOST=""

# Notify on successful update (true/false)
NOTIFY_ON_SUCCESS="true"

# Notify on failed test (true/false)
NOTIFY_ON_FAILURE="true"